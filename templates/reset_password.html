<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - AI Support Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_login.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-icon">🔐</div>

            <h1>Create New Password</h1>

            <p class="subtitle">
                Set a new password for your admin account
            </p>


            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}


            {% if success %}

            <div class="success-message">
                ✅ {{ success }}
            </div>

            <a
                href="{{ url_for('admin_login') }}"
                class="login-button reset-login-button">

                Go to Admin Login →

            </a>

            {% else %}

            <form method="POST">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="password-rule">
                    🔒 Password must contain at least 8 characters.
                </div>


                <button
                    type="submit"
                    class="login-button">

                    Reset Password →

                </button>

            </form>

            {% endif %}


            <div class="divider">
                <span>SECURE PASSWORD RESET</span>
            </div>


            <a
                href="{{ url_for('admin_login') }}"
                class="back-link">

                ← Back to Admin Login

            </a>

        </div>

    </div>

</body>

</html>
