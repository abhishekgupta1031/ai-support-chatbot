<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AI Support Assistant - Intelligent customer support chatbot">

    <title>AI Support Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- ============================= -->
        <!-- HEADER -->
        <!-- ============================= -->

        <header class="chat-header">

            <div class="bot-info">

                <div class="bot-avatar" aria-hidden="true">
                    🤖
                </div>

                <div class="bot-details">

                    <h1>AI Support Assistant</h1>

                    <div class="online-status">
                        <span class="status-dot"></span>
                        <span>Online • Ready to help</span>
                    </div>

                </div>

            </div>

            <div class="header-buttons">

                <a href="/history"
                   class="history-btn"
                   aria-label="View chat history">
                    📊 <span>History</span>
                </a>

                <a href="/admin/login"
                   class="admin-btn"
                   aria-label="Open admin login">
                    🔐 <span>Admin Login</span>
                </a>

            </div>

        </header>


        <!-- ============================= -->
        <!-- CHAT AREA -->
        <!-- ============================= -->

        <main id="chat-box"
              class="chat-box"
              aria-live="polite"
              aria-label="Chat conversation">

            <div class="welcome-message">

                <div class="welcome-icon" aria-hidden="true">
                    🤖
                </div>

                <h2>Welcome! 👋</h2>

                <p>
                    I'm your AI Support Assistant.
                    How can I help you today?
                </p>

                <div class="quick-options">

                    <button
                        type="button"
                        onclick="quickMessage('Where is my order?')">
                        📦 Order Status
                    </button>

                    <button
                        type="button"
                        onclick="quickMessage('I want a refund')">
                        💰 Refund
                    </button>

                    <button
                        type="button"
                        onclick="quickMessage('My payment failed')">
                        💳 Payment
                    </button>

                    <button
                        type="button"
                        onclick="quickMessage('I forgot my password')">
                        🔐 Password
                    </button>

                </div>

            </div>

        </main>


        <!-- ============================= -->
        <!-- TYPING INDICATOR -->
        <!-- ============================= -->

        <div id="typing"
             class="typing"
             role="status"
             aria-label="AI is typing">

            <span aria-hidden="true">🤖</span>

            <span>AI is typing</span>

            <div class="typing-dots"
                 aria-hidden="true">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <!-- ============================= -->
        <!-- INPUT AREA -->
        <!-- ============================= -->

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
                maxlength="500"
                aria-label="Type your message"
            >

            <button
                type="button"
                id="send-button"
                onclick="sendMessage()"
                aria-label="Send message">

                <span id="send-text">Send</span>
                <span id="send-icon">➤</span>

            </button>

        </div>


        <!-- ============================= -->
        <!-- FOOTER -->
        <!-- ============================= -->

        <div class="chat-footer">

            <button
                type="button"
                onclick="clearChat()"
                class="clear-btn">

                🗑️ Clear Chat

            </button>

            <span>
                🔒 Conversations are securely logged
            </span>

        </div>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script>

        const input =
            document.getElementById("user-input");

        const chatBox =
            document.getElementById("chat-box");

        const typing =
            document.getElementById("typing");

        const sendButton =
            document.getElementById("send-button");

        const sendText =
            document.getElementById("send-text");

        const sendIcon =
            document.getElementById("send-icon");


        // ========================================
        // STATE
        // ========================================

        let isSending = false;


        // ========================================
        // ENTER KEY
        // ========================================

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        // ========================================
        // INPUT STATE
        // ========================================

        input.addEventListener(
            "input",
            function() {

                if (input.value.trim()) {

                    sendButton.classList.add(
                        "ready"
                    );

                } else {

                    sendButton.classList.remove(
                        "ready"
                    );

                }

            }
        );


        // ========================================
        // QUICK MESSAGE
        // ========================================

        function quickMessage(message) {

            if (isSending) {
                return;
            }

            input.value = message;

            sendButton.classList.add("ready");

            sendMessage();

        }


        // ========================================
        // SEND MESSAGE
        // ========================================

        async function sendMessage() {

            if (isSending) {
                return;
            }

            const message =
                input.value.trim();


            if (!message) {

                input.focus();

                return;

            }


            isSending = true;


            // --------------------------------
            // Remove Welcome Screen
            // --------------------------------

            const welcome =
                document.querySelector(
                    ".welcome-message"
                );

            if (welcome) {
                welcome.remove();
            }


            // --------------------------------
            // Add User Message
            // --------------------------------

            addMessage(
                message,
                "user"
            );


            // --------------------------------
            // Reset Input
            // --------------------------------

            input.value = "";

            sendButton.classList.remove(
                "ready"
            );


            // --------------------------------
            // Loading State
            // --------------------------------

            setLoadingState(true);


            try {

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                // --------------------------------
                // Natural Typing Delay
                // --------------------------------

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            600
                        )
                );


                // --------------------------------
                // Hide Typing
                // --------------------------------

                typing.style.display =
                    "none";


                // --------------------------------
                // Bot Response
                // --------------------------------

                if (
                    data &&
                    typeof data.response === "string"
                ) {

                    addMessage(
                        data.response,
                        "bot"
                    );

                } else {

                    addMessage(
                        "Sorry, I couldn't process that message. Please try again. 😔",
                        "bot"
                    );

                }


            } catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                typing.style.display =
                    "none";


                addMessage(
                    "Sorry, something went wrong. Please try again. 😔",
                    "bot"
                );


            } finally {

                setLoadingState(false);

                input.focus();

            }

        }


        // ========================================
        // LOADING STATE
        // ========================================

        function setLoadingState(loading) {

            if (loading) {

                typing.style.display =
                    "flex";

                sendButton.disabled =
                    true;

                input.disabled =
                    true;

                sendText.textContent =
                    "Sending";

                sendIcon.textContent =
                    "⏳";

                sendButton.classList.add(
                    "loading"
                );

            } else {

                typing.style.display =
                    "none";

                sendButton.disabled =
                    false;

                input.disabled =
                    false;

                sendText.textContent =
                    "Send";

                sendIcon.textContent =
                    "➤";

                sendButton.classList.remove(
                    "loading"
                );

            }

        }


        // ========================================
        // ADD MESSAGE
        // ========================================

        function addMessage(
            message,
            sender
        ) {

            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.className =
                "message " +
                sender +
                "-message";


            // --------------------------------
            // User Message
            // --------------------------------

            if (sender === "user") {

                messageDiv.innerHTML = `

                    <div class="bubble">

                        ${escapeHtml(message)}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                    <div class="avatar"
                         aria-hidden="true">
                        👤
                    </div>

                `;

            }


            // --------------------------------
            // Bot Message
            // --------------------------------

            else {

                messageDiv.innerHTML = `

                    <div class="avatar"
                         aria-hidden="true">
                        🤖
                    </div>

                    <div class="bubble">

                        ${escapeHtml(message)
                            .replace(
                                /\n/g,
                                "<br>"
                            )}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                `;

            }


            // --------------------------------
            // Add Animation Class
            // --------------------------------

            messageDiv.classList.add(
                "message-enter"
            );


            chatBox.appendChild(
                messageDiv
            );


            // --------------------------------
            // Smooth Scroll
            // --------------------------------

            requestAnimationFrame(
                function() {

                    chatBox.scrollTo({

                        top:
                            chatBox.scrollHeight,

                        behavior:
                            "smooth"

                    });

                }
            );

        }


        // ========================================
        // CLEAR CHAT + BACKEND CONTEXT
        // ========================================

        async function clearChat() {

            if (isSending) {
                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to clear this chat?"
                );


            if (!confirmed) {
                return;
            }


            try {

                // --------------------------------
                // Clear Backend Context
                // --------------------------------

                const response =
                    await fetch(
                        "/clear-context",
                        {
                            method: "POST"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to clear context"
                    );

                }


                // --------------------------------
                // Clear Chat UI
                // --------------------------------

                chatBox.innerHTML = `

                    <div class="welcome-message">

                        <div class="welcome-icon"
                             aria-hidden="true">
                            🤖
                        </div>

                        <h2>Welcome Back! 👋</h2>

                        <p>
                            I'm your AI Support Assistant.
                            How can I help you today?
                        </p>

                        <div class="quick-options">

                            <button
                                type="button"
                                onclick="quickMessage('Where is my order?')">
                                📦 Order Status
                            </button>

                            <button
                                type="button"
                                onclick="quickMessage('I want a refund')">
                                💰 Refund
                            </button>

                            <button
                                type="button"
                                onclick="quickMessage('My payment failed')">
                                💳 Payment
                            </button>

                            <button
                                type="button"
                                onclick="quickMessage('I forgot my password')">
                                🔐 Password
                            </button>

                        </div>

                    </div>

                `;


                // --------------------------------
                // Reset UI
                // --------------------------------

                input.value = "";

                sendButton.classList.remove(
                    "ready"
                );

                input.focus();


            } catch (error) {

                console.error(
                    "Clear chat error:",
                    error
                );


                alert(
                    "Unable to clear conversation. Please try again."
                );

            }

        }


        // ========================================
        // HTML SECURITY
        // ========================================

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(text);

            return div.innerHTML;

        }


        // ========================================
        // INITIAL FOCUS
        // ========================================

        window.addEventListener(
            "load",
            function() {

                input.focus();

            }
        );

    </script>

</body>

</html>
