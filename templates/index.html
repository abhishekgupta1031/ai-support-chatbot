<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AI Support Assistant - Intelligent customer support chatbot">

    <title>AI Support Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">

            <div class="bot-info">

                <div class="bot-avatar" aria-hidden="true">
                    🤖
                </div>

                <div class="bot-details">

                    <h1>AI Support Assistant</h1>

                    <div class="online-status">
                        <span class="status-dot"></span>
                        <span>Online • Ready to help</span>
                    </div>

                </div>

            </div>

            <div class="header-buttons">

                <a href="/history"
                   class="history-btn"
                   aria-label="View chat history">
                    📊 <span>History</span>
                </a>

                <a href="/admin/login"
                   class="admin-btn"
                   aria-label="Open admin login">
                    🔐 <span>Admin Login</span>
                </a>

            </div>

        </header>


        <!-- CHAT AREA -->
        <main id="chat-box"
              class="chat-box"
              aria-live="polite"
              aria-label="Chat conversation">

            <div class="welcome-message">

                <div class="welcome-icon" aria-hidden="true">
                    🤖
                </div>

                <h2>Welcome! 👋</h2>

                <p>
                    I'm your AI Support Assistant.
                    How can I help you today?
                </p>

                <div class="quick-options">

                    <button type="button"
                            onclick="quickMessage('Where is my order?')">
                        📦 Order Status
                    </button>

                    <button type="button"
                            onclick="quickMessage('I want a refund')">
                        💰 Refund
                    </button>

                    <button type="button"
                            onclick="quickMessage('My payment failed')">
                        💳 Payment
                    </button>

                    <button type="button"
                            onclick="quickMessage('I forgot my password')">
                        🔐 Password
                    </button>

                </div>

            </div>

        </main>


        <!-- TYPING INDICATOR -->
        <div id="typing"
             class="typing"
             role="status"
             aria-label="AI is typing">

            <span aria-hidden="true">🤖</span>

            <span>AI is typing</span>

            <div class="typing-dots" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- INPUT AREA -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
                maxlength="500"
                aria-label="Type your message"
            >

            <button
                type="button"
                id="send-button"
                onclick="sendMessage()"
                aria-label="Send message">

                <span id="send-text">Send</span>
                <span id="send-icon">➤</span>

            </button>

        </div>


        <!-- FOOTER -->
        <div class="chat-footer">

            <button
                type="button"
                id="clear-button"
                onclick="clearChat()"
                class="clear-btn">

                🗑️ Clear Chat

            </button>

            <span>
                🔒 Conversations are securely logged
            </span>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // ========================================
        // ELEMENTS
        // ========================================

        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const typing = document.getElementById("typing");

        const sendButton =
            document.getElementById("send-button");

        const sendText =
            document.getElementById("send-text");

        const sendIcon =
            document.getElementById("send-icon");

        const clearButton =
            document.getElementById("clear-button");


        // ========================================
        // STATE
        // ========================================

        let isSending = false;


        // ========================================
        // ENTER KEY
        // ========================================

        input.addEventListener("keydown", function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                if (!isSending) {
                    sendMessage();
                }

            }

        });


        // ========================================
        // INPUT STATE
        // ========================================

        input.addEventListener("input", function() {

            if (input.value.trim() && !isSending) {

                sendButton.classList.add("ready");

            } else {

                sendButton.classList.remove("ready");

            }

        });


        // ========================================
        // QUICK MESSAGE
        // ========================================

        function quickMessage(message) {

            if (isSending) {
                return;
            }

            input.value = message;

            sendButton.classList.add("ready");

            sendMessage();

        }


        // ========================================
        // SEND MESSAGE
        // ========================================

        async function sendMessage() {

            // Prevent duplicate click while current
            // request is being processed.
            if (isSending) {
                return;
            }

            const message = input.value.trim();

            if (!message) {

                input.focus();

                return;

            }


            // Lock sending state
            isSending = true;


            // ----------------------------------------
            // Remove welcome screen
            // ----------------------------------------

            const welcome =
                document.querySelector(".welcome-message");

            if (welcome) {
                welcome.remove();
            }


            // ----------------------------------------
            // Add user message immediately
            // ----------------------------------------

            addMessage(message, "user");


            // ----------------------------------------
            // Clear input
            // ----------------------------------------

            input.value = "";

            sendButton.classList.remove("ready");


            // ----------------------------------------
            // Loading state
            // ----------------------------------------

            setLoadingState(true);


            try {

                // ------------------------------------
                // Send request to Flask
                // ------------------------------------

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                // ------------------------------------
                // Check server response
                // ------------------------------------

                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                // ------------------------------------
                // Natural typing delay
                // ------------------------------------

                await new Promise(function(resolve) {

                    setTimeout(resolve, 600);

                });


                // ------------------------------------
                // Bot response
                // ------------------------------------

                if (
                    data &&
                    typeof data.response === "string" &&
                    data.response.trim() !== ""
                ) {

                    addMessage(
                        data.response,
                        "bot"
                    );

                } else {

                    addMessage(
                        "Sorry, I couldn't process that message. Please try again. 😔",
                        "bot"
                    );

                }


            } catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                addMessage(
                    "Sorry, something went wrong. Please try again. 😔",
                    "bot"
                );


            } finally {

                // ------------------------------------
                // ALWAYS unlock chat
                // ------------------------------------

                isSending = false;

                setLoadingState(false);

                input.disabled = false;
                sendButton.disabled = false;

                input.focus();


                // Restore ready state if needed
                if (input.value.trim()) {

                    sendButton.classList.add("ready");

                } else {

                    sendButton.classList.remove("ready");

                }

            }

        }


        // ========================================
        // LOADING STATE
        // ========================================

        function setLoadingState(loading) {

            if (loading) {

                typing.style.display = "flex";

                sendButton.disabled = true;

                input.disabled = true;

                sendText.textContent = "Sending";

                sendIcon.textContent = "⏳";

                sendButton.classList.add("loading");


                if (clearButton) {
                    clearButton.disabled = false;
                }

            } else {

                typing.style.display = "none";

                sendButton.disabled = false;

                input.disabled = false;

                sendText.textContent = "Send";

                sendIcon.textContent = "➤";

                sendButton.classList.remove("loading");


                if (clearButton) {
                    clearButton.disabled = false;
                }

            }

        }


        // ========================================
        // ADD MESSAGE
        // ========================================

        function addMessage(message, sender) {

            const messageDiv =
                document.createElement("div");


            messageDiv.className =
                "message " +
                sender +
                "-message message-enter";


            // ------------------------------------
            // User message
            // ------------------------------------

            if (sender === "user") {

                messageDiv.innerHTML = `

                    <div class="bubble">

                        ${escapeHtml(message)}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                    <div class="avatar"
                         aria-hidden="true">
                        👤
                    </div>

                `;

            }


            // ------------------------------------
            // Bot message
            // ------------------------------------

            else {

                messageDiv.innerHTML = `

                    <div class="avatar"
                         aria-hidden="true">
                        🤖
                    </div>

                    <div class="bubble">

                        ${escapeHtml(message)
                            .replace(/\n/g, "<br>")}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                `;

            }


            chatBox.appendChild(messageDiv);


            // ------------------------------------
            // Scroll to latest message
            // ------------------------------------

            requestAnimationFrame(function() {

                chatBox.scrollTo({

                    top: chatBox.scrollHeight,

                    behavior: "smooth"

                });

            });

        }


        // ========================================
        // CLEAR CHAT
        // ========================================

        async function clearChat() {

            const confirmed =
                confirm(
                    "Are you sure you want to clear this chat?"
                );


            if (!confirmed) {
                return;
            }


            // ------------------------------------
            // Immediately clear UI
            // ------------------------------------

            chatBox.innerHTML = `

                <div class="welcome-message">

                    <div class="welcome-icon"
                         aria-hidden="true">
                        🤖
                    </div>

                    <h2>Welcome Back! 👋</h2>

                    <p>
                        I'm your AI Support Assistant.
                        How can I help you today?
                    </p>

                    <div class="quick-options">

                        <button
                            type="button"
                            onclick="quickMessage('Where is my order?')">
                            📦 Order Status
                        </button>

                        <button
                            type="button"
                            onclick="quickMessage('I want a refund')">
                            💰 Refund
                        </button>

                        <button
                            type="button"
                            onclick="quickMessage('My payment failed')">
                            💳 Payment
                        </button>

                        <button
                            type="button"
                            onclick="quickMessage('I forgot my password')">
                            🔐 Password
                        </button>

                    </div>

                </div>

            `;


            // ------------------------------------
            // Reset frontend state
            // ------------------------------------

            input.value = "";

            sendButton.classList.remove("ready");

            typing.style.display = "none";

            input.disabled = false;

            sendButton.disabled = false;

            isSending = false;

            setLoadingState(false);

            input.focus();


            // ------------------------------------
            // Clear backend context
            // ------------------------------------

            try {

                const response =
                    await fetch(
                        "/clear-context",
                        {
                            method: "POST",
                            headers: {
                                "Accept": "application/json"
                            }
                        }
                    );


                if (!response.ok) {

                    console.error(
                        "Backend context clear failed:",
                        response.status
                    );

                }

            } catch (error) {

                console.error(
                    "Clear context error:",
                    error
                );

            }

        }


        // ========================================
        // HTML SECURITY
        // ========================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;

        }


        // ========================================
        // INITIAL STATE
        // ========================================

        typing.style.display = "none";

        sendButton.disabled = false;

        input.disabled = false;

        window.addEventListener("load", function() {

            input.focus();

        });

    </script>

</body>

</html>
