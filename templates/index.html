<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Support Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">

            <div class="bot-info">

                <div class="bot-avatar">
                    🤖
                </div>

                <div>
                    <h1>AI Support Assistant</h1>

                    <div class="online-status">
                        <span class="status-dot"></span>
                        Online • Ready to help
                    </div>
                </div>

            </div>

            <a href="/history" class="history-btn">
                📊 History
            </a>

        </header>


        <!-- CHAT AREA -->
        <main id="chat-box" class="chat-box">

            <div class="welcome-message">

                <div class="welcome-icon">
                    🤖
                </div>

                <h2>Welcome! 👋</h2>

                <p>
                    I'm your AI Support Assistant.
                    How can I help you today?
                </p>

                <div class="quick-options">

                    <button onclick="quickMessage('Where is my order?')">
                        📦 Order Status
                    </button>

                    <button onclick="quickMessage('I want a refund')">
                        💰 Refund
                    </button>

                    <button onclick="quickMessage('My payment failed')">
                        💳 Payment
                    </button>

                    <button onclick="quickMessage('I forgot my password')">
                        🔐 Password
                    </button>

                </div>

            </div>

        </main>


        <!-- TYPING INDICATOR -->
        <div id="typing" class="typing">

            <span>🤖</span>

            <span>AI is typing</span>

            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- INPUT -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                id="send-button"
                onclick="sendMessage()"
            >
                Send
                <span>➤</span>
            </button>

        </div>


        <!-- FOOTER -->
        <div class="chat-footer">

            <button
                onclick="clearChat()"
                class="clear-btn"
            >
                🗑️ Clear Chat
            </button>

            <span>
                🔒 Conversations are securely logged
            </span>

        </div>

    </div>


    <script>

        const input =
            document.getElementById("user-input");

        const chatBox =
            document.getElementById("chat-box");

        const typing =
            document.getElementById("typing");

        const sendButton =
            document.getElementById("send-button");


        // --------------------------------
        // Enter Key
        // --------------------------------

        input.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );


        // --------------------------------
        // Quick Message
        // --------------------------------

        function quickMessage(message) {

            input.value = message;

            sendMessage();

        }


        // --------------------------------
        // Send Message
        // --------------------------------

        async function sendMessage() {

            const message =
                input.value.trim();


            if (!message) {
                return;
            }


            // Remove welcome screen
            const welcome =
                document.querySelector(".welcome-message");

            if (welcome) {
                welcome.remove();
            }


            // Add user message
            addMessage(
                message,
                "user"
            );


            input.value = "";

            input.focus();


            // Show typing
            typing.style.display = "flex";

            sendButton.disabled = true;


            try {

                const response =
                    await fetch("/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                if (!response.ok) {
                    throw new Error(
                        "Server error"
                    );
                }


                const data =
                    await response.json();


                // Small delay for natural effect
                await new Promise(
                    resolve =>
                        setTimeout(resolve, 600)
                );


                typing.style.display = "none";


                // Bot response
                addMessage(
                    data.response,
                    "bot"
                );


            } catch (error) {

                console.error(error);


                typing.style.display =
                    "none";


                addMessage(
                    "Sorry, something went wrong. Please try again. 😔",
                    "bot"
                );

            }


            sendButton.disabled = false;

            input.focus();

        }


        // --------------------------------
        // Add Message
        // --------------------------------

        function addMessage(
            message,
            sender
        ) {

            const messageDiv =
                document.createElement("div");


            messageDiv.className =
                "message " +
                sender +
                "-message";


            if (sender === "user") {

                messageDiv.innerHTML = `

                    <div class="bubble">

                        ${escapeHtml(message)}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                    <div class="avatar">
                        👤
                    </div>

                `;

            } else {

                messageDiv.innerHTML = `

                    <div class="avatar">
                        🤖
                    </div>

                    <div class="bubble">

                        ${escapeHtml(message)
                            .replace(/\n/g, "<br>")}

                        <span class="message-time">
                            Just now
                        </span>

                    </div>

                `;

            }


            chatBox.appendChild(
                messageDiv
            );


            // Scroll to bottom
            chatBox.scrollTo({

                top: chatBox.scrollHeight,

                behavior: "smooth"

            });

        }


        // --------------------------------
        // Clear Chat + Backend Context
        // --------------------------------

        async function clearChat() {

            const confirmed =
                confirm(
                    "Are you sure you want to clear this chat?"
                );


            if (!confirmed) {
                return;
            }


            try {

                // Clear conversation context
                const response =
                    await fetch(
                        "/clear-context",
                        {
                            method: "POST"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Unable to clear context"
                    );
                }


                // Clear chat UI
                chatBox.innerHTML = `

                    <div class="welcome-message">

                        <div class="welcome-icon">
                            🤖
                        </div>

                        <h2>Welcome Back! 👋</h2>

                        <p>
                            I'm your AI Support Assistant.
                            How can I help you today?
                        </p>

                        <div class="quick-options">

                            <button onclick="quickMessage('Where is my order?')">
                                📦 Order Status
                            </button>

                            <button onclick="quickMessage('I want a refund')">
                                💰 Refund
                            </button>

                            <button onclick="quickMessage('My payment failed')">
                                💳 Payment
                            </button>

                            <button onclick="quickMessage('I forgot my password')">
                                🔐 Password
                            </button>

                        </div>

                    </div>

                `;


                input.value = "";

                input.focus();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to clear conversation. Please try again."
                );

            }

        }


        // --------------------------------
        // HTML Security
        // --------------------------------

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }

    </script>

</body>

</html>
