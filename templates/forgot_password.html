<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - AI Support Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_login.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-icon">🔑</div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Reset your AI Support Chatbot admin password
            </p>


            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}


            {% if message %}
            <div class="success-message">
                ✅ {{ message }}
            </div>
            {% endif %}


            {% if not message %}

            <form method="POST"
                  action="{{ url_for('forgot_password') }}">

                <div class="form-group">

                    <label for="username">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your admin username"
                        autocomplete="username"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Send Reset Link →

                </button>

            </form>

            {% endif %}


            <div class="divider">
                <span>SECURE ACCOUNT RECOVERY</span>
            </div>


            <a
                href="{{ url_for('admin_login') }}"
                class="back-link">

                ← Back to Admin Login

            </a>


            <a
                href="{{ url_for('home') }}"
                class="back-link secondary-link">

                ← Back to Chat

            </a>

        </div>

    </div>

</body>

</html>
