<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - AI Support Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_login.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="login-icon">
                🔐
            </div>

            <!-- Heading -->
            <h1>Admin Login</h1>

            <p class="subtitle">
                AI Support Chatbot Dashboard
            </p>


            <!-- Error Message -->
            {% if error %}

            <div class="error-message">
                ⚠️ {{ error }}
            </div>

            {% endif %}


            <!-- Login Form -->
            <form method="POST"
                  action="{{ url_for('admin_login') }}">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login to Dashboard →

                </button>

            </form>


            <!-- Back to Chat -->
            <a href="{{ url_for('home') }}"
               class="back-link">

                ← Back to Chat

            </a>


            <!-- Demo Credentials -->
            <div class="demo-info">

                <div class="demo-title">
                    🔑 Demo Credentials
                </div>

                <div>
                    Username:
                    <strong>admin</strong>
                </div>

                <div>
                    Password:
                    <strong>admin123</strong>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
